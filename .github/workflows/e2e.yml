---
# Runs the plugin in a real Obsidian (wdio-obsidian-service). Starts with the
# latest release only; widen it with OBSIDIAN_VERSIONS (see wdio.conf.mts).
name: e2e

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20
        with:
          apt-packages: xvfb herbstluftwm

      - run: bun install --frozen-lockfile

      # Obsidian needs a display and a window manager.
      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1
          DISPLAY=:99 herbstluftwm &
          sleep 1

            # The oldest stable Obsidian at or above manifest.json's minAppVersion (1.13.0), and the latest.
      - run: bun run test:e2e
        env:
          WDIO_MAX_INSTANCES: 1
          OBSIDIAN_VERSIONS: "1.13.0/earliest latest/latest"
